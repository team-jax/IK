[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-grasp-rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.2",
  "imageio>=2.37",
  "imageio-ffmpeg>=0.6",
  "mujoco>=3.3",
  "numpy>=1.24,<3",
  "pillow>=10,<13",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanoid_grasp_rl = ["reachmap.npz"]
